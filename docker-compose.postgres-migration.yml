# One-time upgrade only. Keep the original Compose project name and .env.
# Stop the old bot before starting this override; see docs/sqlite-migration.md.
services:
    postgres:
      image: postgres:18-alpine
      container_name: postgres
      environment:
        POSTGRES_USER: "${POSTGRES_USER}"
        POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
        POSTGRES_DB: "${POSTGRES_DB}"
      volumes:
        - postgres18-data:/var/lib/postgresql
        - db-socket:/var/run/postgresql
      restart: unless-stopped
      # The bot connects over the shared socket, which only appears once postgres
      # is actually accepting connections. start_period covers first-run initdb.
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
        interval: 5s
        timeout: 5s
        retries: 12
        start_period: 60s

    tunnelquestbot:
      depends_on:
        postgres:
          condition: service_healthy
      environment:
        POSTGRES_MIGRATION_URL: "${POSTGRES_MIGRATION_URL:-${DATABASE_URL:?Set the old PostgreSQL DATABASE_URL or POSTGRES_MIGRATION_URL}}"
      volumes:
        - "db-socket:${DB_SOCKET_DIR:-/dbsocket}"

volumes:
  postgres18-data:
  db-socket:
