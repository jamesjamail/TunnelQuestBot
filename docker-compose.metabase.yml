# Optional Metabase companion. Not started by ./manage.sh start|update.
# Use: ./manage.sh analytics start
#
# Reads a periodic SQLite snapshot of the production database so Metabase never
# opens the live bot volume. Bind is localhost-only by default.

name: tunnelquestbot-analytics

services:
  metabase-snapshot:
    image: "${TUNNELQUESTBOT_IMAGE:-ghcr.io/jamesjamail/tunnelquestbot/prod/tunnelquestbot:latest}"
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-5}"
    environment:
      METABASE_SNAPSHOT_INTERVAL_SECONDS: "${METABASE_SNAPSHOT_INTERVAL_SECONDS:-300}"
    entrypoint: ["/bin/sh", "/snapshot/snapshot-entrypoint.sh"]
    volumes:
      - type: volume
        source: sqlite-data
        target: /data
      - type: volume
        source: metabase-snapshots
        target: /snapshots
      - type: bind
        source: ./metabase/snapshot-entrypoint.sh
        target: /snapshot/snapshot-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  metabase:
    image: "${METABASE_IMAGE:-metabase/metabase:v0.63.x}"
    depends_on:
      metabase-snapshot:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-5}"
    ports:
      - "${METABASE_BIND:-127.0.0.1}:${METABASE_PORT:-3000}:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: "${METABASE_TIMEZONE:-UTC}"
    volumes:
      - metabase-data:/metabase-data
      # Writable: SQLite needs journal/WAL siblings even for analytics queries.
      # This is the snapshot volume, not the live bot database.
      - metabase-snapshots:/snapshots

volumes:
  # Shared with the main tunnelquestbot project; never created by this file.
  sqlite-data:
    external: true
    name: tunnelquestbot_sqlite-data
  metabase-data:
  metabase-snapshots:
