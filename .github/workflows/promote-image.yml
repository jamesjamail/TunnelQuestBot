name: Promote Image Dev->Prod

on: workflow_dispatch

jobs:
  promote-image:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull latest dev image
        run: docker pull ghcr.io/${{ github.repository_owner }}/tunnelquestbot/dev/tunnelquestbot:latest
      - name: Re-tag image for prod
        run: docker tag ghcr.io/${{ github.repository_owner }}/tunnelquestbot/dev/tunnelquestbot:latest ghcr.io/${{ github.repository_owner }}/tunnelquestbot/prod/tunnelquestbot:latest
      - name: Push image to prod
        run: docker push ghcr.io/${{ github.repository_owner }}/tunnelquestbot/prod/tunnelquestbot:latest
