name: Image Build and Publish

on:
  push:
    branches: [main]
  pull_request:

# Registry writes are granted only to the main-branch image job.
permissions:
  contents: read

#	A new push supersedes whatever was already running for the same branch or PR.
#	Only main is left to finish, because its run is what publishes the image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:integration

  # Both paths use the same build and smoke steps. PRs have no registry writes.
  smoke:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/container.yml
    permissions:
      contents: read

  build-image-and-push:
    needs: [test, integration]
    if: github.event_name == 'push'
    uses: ./.github/workflows/container.yml
    with:
      publish: true
    permissions:
      contents: read
      packages: write
