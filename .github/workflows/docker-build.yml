name: Image Build and Publish

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

# Registry writes are granted only to the release image job.
permissions:
  contents: read

#	A newer push or pull request supersedes an older run of the same ref.
#	A release publish is left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:integration

  #	Normalize v1.4.0 to 1.4.0 and reject anything that is not semver.
  #	Image tags cannot carry build metadata, so +sha is rejected too.
  release-version:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: semver
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sh scripts/release-version.sh "$TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  #	Pull requests and main pushes prove the image starts. They do not push.
  smoke:
    if: github.event_name != 'release'
    uses: ./.github/workflows/container.yml
    permissions:
      contents: read

  build-image-and-push:
    needs: [test, integration, release-version]
    if: >-
      github.event_name == 'release' &&
      needs.test.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.release-version.result == 'success'
    uses: ./.github/workflows/container.yml
    with:
      publish: true
      version: ${{ needs.release-version.outputs.version }}
    permissions:
      contents: read
      packages: write
