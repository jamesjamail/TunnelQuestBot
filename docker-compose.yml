services:
    postgres:
      image: postgres:18-alpine
      container_name: postgres
      environment:
        POSTGRES_USER: "${POSTGRES_USER}"
        POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
        POSTGRES_DB: "${POSTGRES_DB}"
      volumes:
        - postgres18-data:/var/lib/postgresql
        - db-socket:/var/run/postgresql
      restart: unless-stopped
      # The bot connects over the shared socket, which only appears once postgres
      # is actually accepting connections. start_period covers first-run initdb.
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
        interval: 5s
        timeout: 5s
        retries: 12
        start_period: 60s

    redis:
      image: redis:alpine
      container_name: redis
      environment:
        REDIS_CONFIG: |
          unixsocket /var/run/redis/redis.sock
          unixsocketperm 777
      command:
        sh -c "echo \"$$REDIS_CONFIG\" > /etc/redis.conf && redis-server /etc/redis.conf"
      volumes:
        - redis-data:/data
        - redis-socket:/var/run/redis
      restart: unless-stopped
      # Probe the socket rather than the TCP port, since that is what the bot uses.
      healthcheck:
        test: ["CMD", "redis-cli", "-s", "/var/run/redis/redis.sock", "ping"]
        interval: 5s
        timeout: 5s
        retries: 12
        start_period: 20s

    tunnelquestbot:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: tunnelquestbot
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      environment:
        SERVERS_BLUE_LOG_FILE_PATH: "/logfiles/${SERVERS_BLUE_LOG_FILE}"
        SERVERS_GREEN_LOG_FILE_PATH: "/logfiles/${SERVERS_GREEN_LOG_FILE}"
        SERVERS_RED_LOG_FILE_PATH: "/logfiles/${SERVERS_RED_LOG_FILE}"
        REDIS_SOCKET_DIR: "${REDIS_SOCKET_DIR}"
        FAKE_LOGS: "${FAKE_LOGS:-false}"
        DEBUG_MODE: "${DEBUG_MODE:-false}"
      volumes:
        - type: bind
          source: "${LOG_SOURCE_PATH}"
          target: /logfiles
        - type: bind
          source: ".env"
          target: /app/.env
        - "db-socket:${DB_SOCKET_DIR}"
        - "redis-socket:${REDIS_SOCKET_DIR}"
      restart: always
      ports:
        # Node.js Debug port is 9229
        # It would be better to open this conditionally, but doing that in
        # docker-compose isn't straightforward. This likely won't hurt to open even
        # for our production server because ... it's a NUC in someone's basement.
        - "9229:9229"

volumes:
  postgres18-data:
  db-socket:
  redis-socket:
  redis-data:
