x-default-logging: &default-logging
  driver: local
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-5}"

services:
    postgres:
      image: postgres:18-alpine
      container_name: postgres
      logging: *default-logging
      environment:
        POSTGRES_USER: "${POSTGRES_USER}"
        POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
        POSTGRES_DB: "${POSTGRES_DB}"
      volumes:
        - postgres18-data:/var/lib/postgresql
        - db-socket:/var/run/postgresql
      restart: unless-stopped
      # The bot connects over the shared socket, which only appears once postgres
      # is actually accepting connections. start_period covers first-run initdb.
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
        interval: 5s
        timeout: 5s
        retries: 12
        start_period: 60s

    redis:
      image: redis:alpine
      container_name: redis
      logging: *default-logging
      environment:
        REDIS_CONFIG: |
          unixsocket /var/run/redis/redis.sock
          unixsocketperm 777
      command:
        sh -c "echo \"$$REDIS_CONFIG\" > /etc/redis.conf && redis-server /etc/redis.conf"
      volumes:
        - redis-data:/data
        - redis-socket:/var/run/redis
      restart: unless-stopped
      # Probe the socket rather than the TCP port, since that is what the bot uses.
      healthcheck:
        test: ["CMD", "redis-cli", "-s", "/var/run/redis/redis.sock", "ping"]
        interval: 5s
        timeout: 5s
        retries: 12
        start_period: 20s

    p99-logger-init:
      image: busybox:1.37.0
      logging: *default-logging
      environment:
        P99_UID: "${P99_UID:-65534}"
        P99_GID: "${P99_GID:-65534}"
      command:
        - sh
        - -ec
        - |
          mkdir -p /data/green /data/blue /data/red
          touch /data/green/chat.jsonl /data/blue/chat.jsonl /data/red/chat.log
          chown -R "$$P99_UID:$$P99_GID" /data/green /data/blue /data/red
          chmod 750 /data/green /data/blue /data/red
          chmod 640 /data/green/chat.jsonl /data/blue/chat.jsonl /data/red/chat.log
      volumes:
        - p99-logger-data:/data
      restart: "no"

    p99-green-logger:
      image: "${P99_LOGGER_IMAGE:-ghcr.io/rm-you/p99-logger-client:sha-fbb036a}"
      profiles: ["p99-loggers"]
      logging: *default-logging
      user: "${P99_UID:-65534}:${P99_GID:-65534}"
      command: ["/config/config.json"]
      depends_on:
        p99-logger-init:
          condition: service_completed_successfully
        p99-log-retention:
          condition: service_started
      volumes:
        - type: bind
          source: "${P99_GREEN_CONFIG_FILE:-./p99-logger/green.json}"
          target: /config/config.json
          read_only: true
          bind:
            create_host_path: false
        - p99-logger-data:/data
      read_only: true
      cap_drop: ["ALL"]
      security_opt: ["no-new-privileges:true"]
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "/p99-logger-client", "health", "/data/green/health.json"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 60s

    p99-blue-logger:
      image: "${P99_LOGGER_IMAGE:-ghcr.io/rm-you/p99-logger-client:sha-fbb036a}"
      profiles: ["p99-loggers"]
      logging: *default-logging
      user: "${P99_UID:-65534}:${P99_GID:-65534}"
      command: ["/config/config.json"]
      depends_on:
        p99-logger-init:
          condition: service_completed_successfully
        p99-log-retention:
          condition: service_started
      volumes:
        - type: bind
          source: "${P99_BLUE_CONFIG_FILE:-./p99-logger/blue.json}"
          target: /config/config.json
          read_only: true
          bind:
            create_host_path: false
        - p99-logger-data:/data
      read_only: true
      cap_drop: ["ALL"]
      security_opt: ["no-new-privileges:true"]
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "/p99-logger-client", "health", "/data/blue/health.json"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 60s

    p99-log-retention:
      build:
        context: .
        dockerfile: p99-logger/retention.Dockerfile
      profiles: ["p99-loggers"]
      logging: *default-logging
      user: "${P99_UID:-65534}:${P99_GID:-65534}"
      environment:
        P99_JSONL_MAX_SIZE: "${P99_JSONL_MAX_SIZE:-100M}"
        P99_JSONL_ROTATE_COUNT: "${P99_JSONL_ROTATE_COUNT:-5}"
        P99_JSONL_ROTATE_INTERVAL_SECONDS: "${P99_JSONL_ROTATE_INTERVAL_SECONDS:-300}"
      depends_on:
        p99-logger-init:
          condition: service_completed_successfully
      volumes:
        - p99-logger-data:/data
      read_only: true
      tmpfs:
        - /tmp:mode=1777,size=1m
      cap_drop: ["ALL"]
      security_opt: ["no-new-privileges:true"]
      restart: unless-stopped

    tunnelquestbot:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: tunnelquestbot
      logging: *default-logging
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
        p99-logger-init:
          condition: service_completed_successfully
      environment:
        SERVERS_BLUE_LOG_FILE_PATH: "${SERVERS_BLUE_LOG_FILE_PATH:-/logfiles/${SERVERS_BLUE_LOG_FILE}}"
        SERVERS_GREEN_LOG_FILE_PATH: "${SERVERS_GREEN_LOG_FILE_PATH:-/logfiles/${SERVERS_GREEN_LOG_FILE}}"
        SERVERS_RED_LOG_FILE_PATH: "${SERVERS_RED_LOG_FILE_PATH:-/logfiles/${SERVERS_RED_LOG_FILE}}"
        REDIS_SOCKET_DIR: "${REDIS_SOCKET_DIR}"
        FAKE_LOGS: "${FAKE_LOGS:-false}"
        DEBUG_MODE: "${DEBUG_MODE:-false}"
      volumes:
        - type: bind
          source: "${LOG_SOURCE_PATH:-./logs}"
          target: /logfiles
        - type: volume
          source: p99-logger-data
          target: /p99-logger
          read_only: true
        - type: bind
          source: ".env"
          target: /app/.env
        - "db-socket:${DB_SOCKET_DIR}"
        - "redis-socket:${REDIS_SOCKET_DIR}"
      restart: always
      ports:
        # Node.js Debug port is 9229
        # It would be better to open this conditionally, but doing that in
        # docker-compose isn't straightforward. This likely won't hurt to open even
        # for our production server because ... it's a NUC in someone's basement.
        - "9229:9229"

volumes:
  postgres18-data:
  db-socket:
  redis-socket:
  redis-data:
  p99-logger-data:
